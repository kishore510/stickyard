name: CI

on:
  push:
  pull_request:
  # Manual run from any branch: checks, then deploys the Worker (and Pages, if the
  # github-pages environment allows that branch; by default only main).
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Also deploy GitHub Pages (only works from branches the github-pages environment allows)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy-worker:
    name: Deploy Worker
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-worker
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: wrangler deploy
        working-directory: worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Pushes CREATE_PASSCODE and ROOM_SIGNING_KEY from GitHub secrets to the Worker.
      # The values travel only through step env vars into stdin (`secret bulk` reads JSON
      # from stdin): never on a command line, never written to disk, never echoed.
      # If either GitHub secret is missing the step skips, and the Worker keeps whatever
      # it had (deploys never delete secrets; with none, creating and joining fail closed).
      # Rotate: `gh secret set <NAME>`, then re-run this workflow.
      - name: Push Worker secrets
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CREATE_PASSCODE: ${{ secrets.CREATE_PASSCODE }}
          ROOM_SIGNING_KEY: ${{ secrets.ROOM_SIGNING_KEY }}
        run: |
          if [ -z "$CREATE_PASSCODE" ] || [ -z "$ROOM_SIGNING_KEY" ]; then
            echo "::warning::CREATE_PASSCODE or ROOM_SIGNING_KEY is not set as a GitHub secret; Worker secrets left unchanged."
            exit 0
          fi
          node -e 'process.stdout.write(JSON.stringify({CREATE_PASSCODE: process.env.CREATE_PASSCODE, ROOM_SIGNING_KEY: process.env.ROOM_SIGNING_KEY}))' \
            | npx wrangler secret bulk > /dev/null
          echo "Worker secrets updated."

  deploy-pages:
    name: Deploy Pages
    needs: check
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: deploy-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build web
        run: npm run build -w web
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
